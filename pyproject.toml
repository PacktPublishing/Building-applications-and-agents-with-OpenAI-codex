[project]
name = "mastering-openai-agents"
version = "0.1.0"
description = "Workspace for the Mastering OpenAI Agents course labs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "agents-sdk-sampler",
  "handoffs-patterns",
  "openai-agents>=0.23.1",
  "realtime-voice-agent",
  "sql-analyzer-agent",
  "text-stats",
]

[dependency-groups]
dev = [
  "pytest-asyncio>=0.23",
  "pytest>=8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
agents-sdk-sampler = { workspace = true }
handoffs-patterns = { workspace = true }
realtime-voice-agent = { workspace = true }
sql-analyzer-agent = { workspace = true }
text-stats = { workspace = true }

[tool.uv.workspace]
members = [
  "lab-00-codex-workflow/reference-solution",
  "lab-01-agent-basics/reference-solution",
  "lab-002-handoffs-patterns/reference-solution",
  "lab-003-sandboxagent-sampler/reference-solution",
  "lab-004-sql-analyzer/reference-solution",
  "lab-005-realtime-voice-agent/reference-solution",
]
