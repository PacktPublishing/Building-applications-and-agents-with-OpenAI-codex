<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f4ef" />
    <title>Lab 05 · Browser Realtime Voice Agent</title>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">LAB 05 · JAVASCRIPT REALTIME</p>
      <h1>Talk to the voice agent</h1>
      <p class="intro">A live speech-to-speech session runs over WebRTC. Your API key stays on the token server.</p>
      <div class="controls">
        <button id="start" type="button">Start session</button>
        <button id="stop" type="button" disabled>Stop session</button>
      </div>
      <form id="text-form">
        <label for="message">Optional text message</label>
        <div class="message-row">
          <input id="message" name="message" autocomplete="off" placeholder="Type a message…" disabled />
          <button id="send" type="submit" disabled>Send</button>
        </div>
      </form>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Session log</h2>
        <ol id="log" aria-live="polite"></ol>
      </section>
      <p class="footnote">Grant microphone access when prompted. Stop the session to close its microphone and WebRTC connection.</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
