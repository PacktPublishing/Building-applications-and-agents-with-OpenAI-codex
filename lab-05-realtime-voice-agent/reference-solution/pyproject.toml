[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtime-voice-agent"
version = "0.1.0"
description = "Python voice agent lab using the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai-agents[voice]",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
mic = [
    "sounddevice",
]

[tool.hatch.build.targets.wheel]
packages = ["src/realtime_voice_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
